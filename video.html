<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Lecture Video | Dr. Menna Sherif</title>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@500;600;700&family=Poppins:wght@300;400;500;600&display=swap" rel="stylesheet">

    <style>

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Poppins', sans-serif;
            background: #000;
            color: #fff;
            min-height: 100vh;
        }

        .video-page {
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 60px 20px;
        }

        h1 {
            font-family: 'Cinzel', serif;
            color: #d4af37;
            font-size: 42px;
            text-align: center;
            margin-bottom: 10px;
        }

        .doctor-name {
            color: #ddd;
            font-size: 17px;
            margin-bottom: 35px;
            text-align: center;
        }

        .video-container {
            width: 90%;
            max-width: 1000px;
            border: 2px solid #d4af37;
            border-radius: 18px;
            overflow: hidden;
            box-shadow: 0 0 30px rgba(212, 175, 55, 0.25);
            background: #111;
        }

        .video-container iframe {
            display: block;
            width: 100%;
            height: 560px;
            border: none;
        }

        .back-btn {
            margin-top: 35px;
            padding: 12px 28px;
            background: #d4af37;
            color: #000;
            text-decoration: none;
            font-weight: 600;
            border-radius: 6px;
            transition: 0.3s;
        }

        .back-btn:hover {
            background: #fff;
            transform: translateY(-2px);
        }

        @media (max-width: 768px) {

            h1 {
                font-size: 28px;
            }

            .video-container {
                width: 100%;
            }

            .video-container iframe {
                height: 300px;
            }

        }

    </style>

</head>

<body>

    <div class="video-page">

        <h1>Lecture Video</h1>

        <div class="doctor-name">
            Dr. Menna Sherif
        </div>

        <div class="video-container">

            <iframe
                src="https://fembed.co/embed/QTAC_8w-dZGEH"
                width="100%"
                height="315"
                frameborder="0"
                allowfullscreen>
            </iframe>

        </div>

        <a href="lectures.html" class="back-btn">
            ← Back to Lecture Archive
        </a>

    </div>

</body>

</html>
